name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MISE_EXPERIMENTAL: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: mise run test
      - run: git diff --check
